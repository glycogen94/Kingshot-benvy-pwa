<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Kingshot defense prototype running in WebGPU" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Kingshot PWA Prototype</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #050608;
        --fg: #e7ecf5;
        --accent: #4da3ff;
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 0.75rem 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(22, 26, 30, 0.85);
        backdrop-filter: blur(8px);
      }

      #status {
        font-size: 0.875rem;
        color: rgba(231, 236, 245, 0.72);
      }

      main {
        flex: 1 1 auto;
        position: relative;
      }

      canvas#game-canvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }

      noscript {
        margin: 2rem;
        padding: 1rem;
        background: rgba(255, 84, 84, 0.08);
        border: 1px solid rgba(255,84,84,0.35);
        border-radius: 8px;
        color: #ff8888;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Kingshot PWA Prototype</strong>
      <span id="status">Bootstrapping…</span>
    </header>
    <main>
      <canvas id="game-canvas" tabindex="0"></canvas>
      <noscript>This experience requires JavaScript enabled to start the game.</noscript>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
